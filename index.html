<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Pedidos Hamburguesas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4 text-center">Registrar Pedido</h1>

      <div class="card shadow-sm">
        <div class="card-body">
          <form id="pedidoForm">
            <h5 class="mb-3">Hamburguesas con Papas (25 Bs)</h5>
            <div class="mb-3 form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="hamburguesa1"
              />
              <label class="form-check-label" for="hamburguesa1"
                >Hamburguesa Clásica con Papas</label
              >
              <input
                type="number"
                id="cantidad1"
                class="form-control mt-2"
                placeholder="Cantidad"
                min="1"
                disabled
              />
            </div>

            <div class="mb-3 form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="hamburguesa2"
              />
              <label class="form-check-label" for="hamburguesa2"
                >Hamburguesa Doble con Papas</label
              >
              <input
                type="number"
                id="cantidad2"
                class="form-control mt-2"
                placeholder="Cantidad"
                min="1"
                disabled
              />
            </div>

            <h5 class="mt-4 mb-3">Hamburguesas sin Papas (20 Bs)</h5>
            <div class="mb-3 form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="hamburguesa3"
              />
              <label class="form-check-label" for="hamburguesa3"
                >Hamburguesa Clásica sin Papas</label
              >
              <input
                type="number"
                id="cantidad3"
                class="form-control mt-2"
                placeholder="Cantidad"
                min="1"
                disabled
              />
            </div>

            <div class="mb-3 form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="hamburguesa4"
              />
              <label class="form-check-label" for="hamburguesa4"
                >Hamburguesa Doble sin Papas</label
              >
              <input
                type="number"
                id="cantidad4"
                class="form-control mt-2"
                placeholder="Cantidad"
                min="1"
                disabled
              />
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold"
                >Total: <span id="totalDisplay">0</span> Bs</label
              >
            </div>

            <button type="button" class="btn btn-primary w-100" id="btnEnviar">Enviar Pedido</button>

          </form>

          <p id="estado" class="mt-3 text-success fw-bold text-center"></p>
        </div>
      </div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
