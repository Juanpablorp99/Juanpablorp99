<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menú de Hamburguesas 🍔</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 text-center">🍔 Menú de Hamburguesas</h1>

        <form id="orderForm" class="card p-4 shadow-sm">
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" name="pedido" value="Hamburguesa Clásica" id="clasica">
                <label class="form-check-label" for="clasica">
                    Hamburguesa Clásica 🍔
                </label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" name="pedido" value="Hamburguesa Doble" id="doble">
                <label class="form-check-label" for="doble">
                    Hamburguesa Doble 🍔🍔
                </label>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="pedido" value="Hamburguesa Vegana" id="vegana">
                <label class="form-check-label" for="vegana">
                    Hamburguesa Vegana 🌱
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100">Pedir Ahora</button>
        </form>

        <div id="msg" class="mt-3 text-center"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
